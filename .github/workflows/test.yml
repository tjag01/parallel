name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tmux and shellcheck
        run: sudo apt-get update && sudo apt-get install -y tmux shellcheck
      - name: shellcheck
        run: shellcheck -S warning bin/cc-parallel tests/smoke.sh
      - name: smoke test (stub claude)
        run: bash tests/smoke.sh
